[project]
name = "mat-agent"
version = "0.2.0"
description = "Local materials research agent built on DeepSeek Harness"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "integrations/deepseek-harness/LICENSE.upstream"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.3", "scipy==1.16.3", "matplotlib==3.11.2",
  "openpyxl==3.1.5", "xlrd==2.0.2", "pypdf==6.19.0",
  "Pillow==12.3.0", "rdkit==2025.9.6", "gemmi==0.7.5", "PyYAML==6.0.3", "pint==0.25.2",
  "ase==3.29.0", "pypdfium2==5.14.0", "opencv-python-headless==5.0.0.93",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
mat-agent = "highzyme.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
